[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torch2rtl"
version = "0.2.0"
description = "Minimal PyTorch FX to fixed-point SystemVerilog compiler flow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "torch2rtl contributors" },
]
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.26",
  "torch>=2.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
torch2rtl = "torch2rtl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["torch2rtl"]

[tool.hatch.build.targets.wheel.force-include]
"examples/tiny_mlp/model.py" = "examples/tiny_mlp/model.py"
"examples/grid_classifier/model.py" = "examples/grid_classifier/model.py"
"examples/tiny_conv/model.py" = "examples/tiny_conv/model.py"
"examples/image_cnn/model.py" = "examples/image_cnn/model.py"
"examples/image_cnn/data.py" = "examples/image_cnn/data.py"
