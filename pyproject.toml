[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torch2rtl"
version = "0.2.0"
description = "Minimal PyTorch FX to fixed-point SystemVerilog compiler flow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "torch2rtl contributors" },
]
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.26",
  "torch>=2.2",
]

[project.scripts]
torch2rtl = "torch2rtl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--basetemp=temp/pytest"]

[tool.hatch.build.targets.wheel]
packages = ["torch2rtl"]
